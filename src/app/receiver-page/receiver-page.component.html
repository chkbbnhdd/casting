<main class="receiver-root">
  <cast-media-player class="media-player"></cast-media-player>

  <div class="logo">
    <img src="/dr_logo.svg" alt="DR logo" />
  </div>

  <section class="info">
    <p class="eyebrow">DR Cast Receiver</p>
    <div class="logo-title">
      <img src="/dr_logo.svg" alt="DR logo" />
    </div>
    <p id="subtitle">{{ subtitle() }}</p>
  </section>

  <section class="next-up" *ngIf="nextItemTitle()">
    <p class="next-label">Up Next</p>
    <div class="next-item">
      <img *ngIf="nextItemThumbnail()" [src]="nextItemThumbnail()" alt="{{ nextItemTitle() }}" class="next-thumbnail" />
      <p class="next-title">{{ nextItemTitle() }}</p>
    </div>
  </section>

  <section class="diagnostics">
    <pre aria-live="polite">
@for (log of logs(); track $index) {
{{ log }}
}
    </pre>
  </section>
</main>
